<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <image id="photo" width="400" height="400" preserveAspectRatio="xMidYMin slice"
           xlink:href="data:image/jpeg;base64,<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <image id="photo" width="400" height="400" preserveAspectRatio="xMidYMin slice"
           xlink:href="data:image/jpeg;base64,PHOTO_BASE64"/>

    <!-- neon sketch: edges -> red -> glow -->
    <filter id="neon" x="0" y="0" width="400" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" result="g"/>
      <feGaussianBlur in="g" stdDeviation="1.1" result="soft"/>
      <feConvolveMatrix in="soft" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1"
                        divisor="1" bias="0" edgeMode="duplicate" preserveAlpha="true" result="edge"/>
      <feComponentTransfer in="edge" result="amp">
        <feFuncR type="linear" slope="6"/><feFuncG type="linear" slope="6"/><feFuncB type="linear" slope="6"/>
      </feComponentTransfer>
      <feColorMatrix in="amp" type="matrix" result="line"
        values="1 0 0 0 0  0.25 0 0 0 0  0.3 0 0 0 0  0 0 0 1 0"/>
      <feGaussianBlur in="line" stdDeviation="2.5" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="line"/><feMergeNode in="line"/></feMerge>
    </filter>

    <!-- faint dark-red ghost of the photo under the sketch -->
    <filter id="ghost" x="0" y="0" width="400" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.4 0.4 0.4 0 0  0.04 0.04 0.04 0 0  0.05 0.05 0.05 0 0  0 0 0 1 0"/>
    </filter>

    <filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#DC2626" stroke-width="0.6" opacity="0.28"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.16"/>
    </pattern>

    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EF4444" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>

    <!-- scanned area follows the laser down and back up -->
    <clipPath id="scanned">
      <rect x="0" y="0" width="400" height="0">
        <animate attributeName="height" dur="8s" repeatCount="indefinite" calcMode="spline"
                 values="0;400;400;0;0" keyTimes="0;0.45;0.62;0.82;1"
                 keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 1. original photo -->
  <rect width="400" height="400" fill="#0a0a0a"/>
  <use xlink:href="#photo"/>
  <rect width="400" height="400" fill="#DC2626" opacity="0.10"/>

  <!-- 2. scanned area: grid + ghost + neon sketch -->
  <g clip-path="url(#scanned)">
    <rect width="400" height="400" fill="#070707"/>
    <use xlink:href="#photo" filter="url(#ghost)" opacity="0.6"/>
    <rect width="400" height="400" fill="url(#grid)"/>
    <use xlink:href="#photo" filter="url(#neon)"/>
  </g>

  <!-- 3. laser -->
  <g>
    <rect x="0" y="-40" width="400" height="80" fill="url(#trail)"/>
    <rect x="0" y="-1.5" width="400" height="3" fill="#F87171" filter="url(#glow)"/>
    <polygon points="0,-8 12,0 0,8" fill="#EF4444"/>
    <polygon points="400,-8 388,0 400,8" fill="#EF4444"/>
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                      calcMode="spline" values="0 0;0 400;0 400;0 0;0 0" keyTimes="0;0.45;0.62;0.82;1"
                      keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
  </g>

  <!-- 4. glitch flash when scan completes -->
  <rect y="150" width="400" height="12" fill="#EF4444" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete"
             values="0;0.55;0;0.35;0;0" keyTimes="0;0.45;0.47;0.49;0.51;1"/>
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                      calcMode="discrete" values="0 0;12 0;-10 70;8 -40;0 0;0 0" keyTimes="0;0.45;0.47;0.49;0.51;1"/>
  </rect>

  <!-- 5. CRT scanlines + vignette -->
  <rect width="400" height="400" fill="url(#scan)"/>
  <rect width="400" height="400" fill="url(#vig)"/>

  <!-- 6. HUD: status bar -->
  <rect y="352" width="400" height="48" fill="#000" opacity="0.6"/>
  <rect x="14" y="360" width="372" height="3" fill="#7F1D1D" opacity="0.6"/>
  <rect x="14" y="360" width="0" height="3" fill="#EF4444" filter="url(#glow)">
    <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline"
             values="0;372;372;0;0" keyTimes="0;0.45;0.62;0.82;1"
             keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
  </rect>
  <g font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#F87171">
    <text x="14" y="385">&gt; SCANNING_<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0;0" keyTimes="0;0.45;1"/></text>
    <text x="14" y="385" opacity="0">&gt; ACCESS GRANTED<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.45;0.62;1"/></text>
    <text x="14" y="385" opacity="0">&gt; RESTORING...<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.62;0.82;1"/></text>
    <text x="14" y="385" opacity="0">&gt; AMOL PAWAR // DEV<animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.82"/></text>
    <text x="386" y="22" font-size="10" text-anchor="end" opacity="0.85">ID:AP-24
      <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="0.9;0.3;0.9"/></text>
  </g>

  <!-- 7. corner brackets + square glowing border -->
  <path d="M10 42V10H42M358 10H390V42M390 330V362H358M42 362H10V330" fill="none" stroke="#F87171" stroke-width="3"/>
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="#DC2626" stroke-width="4" filter="url(#glow)">
    <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="1;0.55;1"/>
  </rect>
</svg>"/>

