<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="100%" height="300">
  <defs>
    <image id="photo" x="36" y="40" width="220" height="220" preserveAspectRatio="xMidYMin slice"
           xlink:href="data:image/jpeg;base64,PHOTO_BASE64"/>
    <clipPath id="pbox"><rect x="36" y="40" width="220" height="220"/></clipPath>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/><stop offset="50%" stop-color="#0f0709"/><stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="red-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4458"/><stop offset="40%" stop-color="#ff1a35"/>
      <stop offset="70%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ff2a45"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/><stop offset="30%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ff4d6d"/><stop offset="70%" stop-color="#ef4444"/><stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0"/><stop offset="1" stop-color="#EF4444" stop-opacity="0.45"/>
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ambient-blur"><feGaussianBlur stdDeviation="40"/></filter>

    <!-- photo -> neon sketch -->
    <filter id="neon" x="36" y="40" width="220" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" result="g"/>
      <feGaussianBlur in="g" stdDeviation="1" result="s"/>
      <feConvolveMatrix in="s" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" divisor="1" edgeMode="duplicate" preserveAlpha="true" result="e"/>
      <feComponentTransfer in="e" result="a">
        <feFuncR type="linear" slope="6"/><feFuncG type="linear" slope="6"/><feFuncB type="linear" slope="6"/>
      </feComponentTransfer>
      <feColorMatrix in="a" type="matrix" result="l" values="1 0 0 0 0  0.25 0 0 0 0  0.3 0 0 0 0  0 0 0 1 0"/>
      <feGaussianBlur in="l" stdDeviation="2" result="h"/>
      <feMerge><feMergeNode in="h"/><feMergeNode in="l"/><feMergeNode in="l"/></feMerge>
    </filter>
    <filter id="ghost" x="36" y="40" width="220" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.4 0.4 0.4 0 0  0.04 0.04 0.04 0 0  0.05 0.05 0.05 0 0  0 0 0 1 0"/>
    </filter>

    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ef4444" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="pgrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.15"/>
    </pattern>

    <clipPath id="scanned">
      <rect x="36" y="40" width="220" height="0">
        <animate attributeName="height" dur="8s" repeatCount="indefinite" values="0;220;220;0;0" keyTimes="0;0.45;0.6;0.9;1"/>
      </rect>
    </clipPath>

    <!-- typing reveal, 12s loop -->
    <clipPath id="c1"><rect x="310" y="179" width="0" height="18"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;550;550;0;0" keyTimes="0;0.04;0.10;0.94;0.96;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="310" y="195" width="0" height="18"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;550;550;0;0" keyTimes="0;0.11;0.19;0.94;0.96;1"/></rect></clipPath>
    <clipPath id="c3"><rect x="310" y="211" width="0" height="18"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;550;550;0;0" keyTimes="0;0.20;0.28;0.94;0.96;1"/></rect></clipPath>
    <clipPath id="c4"><rect x="310" y="227" width="0" height="18"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;550;550;0;0" keyTimes="0;0.30;0.40;0.94;0.96;1"/></rect></clipPath>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 44px; letter-spacing: 4px; text-transform: uppercase; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; fill: #e2e8f0; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; fill: #ff4d6d; }
    .mono { font-family: Courier New, monospace; font-size: 13px; }
  </style>

  <!-- background (same as header) -->
  <rect width="900" height="300" rx="14" fill="url(#bg-grad)"/>
  <circle cx="150" cy="90" r="90" fill="#dc2626" opacity="0.18" filter="url(#ambient-blur)"/>
  <circle cx="760" cy="170" r="110" fill="#ff1a35" opacity="0.14" filter="url(#ambient-blur)"/>
  <rect width="900" height="300" rx="14" fill="url(#tech-grid)"/>
  <rect x="1.5" y="1.5" width="897" height="297" rx="13" fill="none" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.65"/>
  <path d="M 12 30 L 12 14 L 30 14" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 888 30 L 888 14 L 870 14" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 12 270 L 12 286 L 30 286" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 888 270 L 888 286 L 870 286" stroke="#ff2a45" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- PHOTO: original -->
  <g clip-path="url(#pbox)">
    <rect x="36" y="40" width="220" height="220" fill="#0a0a0a"/>
    <use xlink:href="#photo"/>
    <rect x="36" y="40" width="220" height="220" fill="#DC2626" opacity="0.1"/>
  </g>
  <!-- PHOTO: scanned neon sketch -->
  <g clip-path="url(#scanned)">
    <rect x="36" y="40" width="220" height="220" fill="#070707"/>
    <use xlink:href="#photo" filter="url(#ghost)" opacity="0.6"/>
    <rect x="36" y="40" width="220" height="220" fill="url(#pgrid)"/>
    <use xlink:href="#photo" filter="url(#neon)"/>
  </g>
  <!-- laser -->
  <g clip-path="url(#pbox)">
    <g>
      <rect x="36" y="0" width="220" height="40" fill="url(#trail)"/>
      <rect x="36" y="38.5" width="220" height="3" fill="#F87171" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
                        values="0 0;0 220;0 220;0 0;0 0" keyTimes="0;0.45;0.6;0.9;1"/>
    </g>
  </g>
  <rect x="36" y="40" width="220" height="220" fill="url(#scan)"/>
  <path d="M36 64V40H60M232 40H256V64M256 236V260H232M60 260H36V236" fill="none" stroke="#ff4d6d" stroke-width="3"/>
  <text x="146" y="278" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#EF4444" letter-spacing="2">
    SCANNING...
    <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="1;0.3;1"/>
  </text>

  <!-- badge -->
  <g transform="translate(430, 22)">
    <rect width="300" height="26" rx="13" fill="#17090b" stroke="#ff2a45" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="18" cy="13" r="5" fill="#ef4444">
      <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/>
    </circle>
    <text x="160" y="17.5" text-anchor="middle" class="badge-text">BUILDING REAL-WORLD TECH</text>
  </g>

  <!-- name -->
  <text x="580" y="100" text-anchor="middle" class="title-text" fill="url(#red-glow-grad)" filter="url(#glow-red)">AMOL PAWAR</text>
  <text x="580" y="100" text-anchor="middle" class="title-text" fill="#ffffff" fill-opacity="0.95">AMOL PAWAR</text>

  <!-- subtitle -->
  <text x="580" y="130" text-anchor="middle" class="subtitle-text">
    <tspan fill="#ff4d6d">FULL STACK DEVELOPER</tspan><tspan fill="#64748b"> &#8226; </tspan><tspan fill="#f1f5f9">MERN STACK</tspan><tspan fill="#64748b"> &#8226; </tspan><tspan fill="#ff4d6d">JAVA FULL STACK</tspan>
  </text>

  <!-- divider -->
  <g transform="translate(0, 150)">
    <line x1="310" y1="0" x2="550" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8"/>
    <polygon points="580,-5 585,0 580,5 575,0" fill="#ef4444" filter="url(#glow-red)"/>
    <line x1="610" y1="0" x2="850" y2="0" stroke="url(#border-grad)" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- code panel -->
  <rect x="296" y="166" width="568" height="86" rx="8" fill="#0c0709" stroke="#ef4444" stroke-opacity="0.25"/>
  <g class="mono" xml:space="preserve">
    <text x="310" y="192" clip-path="url(#c1)"><tspan fill="#EF4444">const</tspan><tspan fill="#f3f4f6"> developer </tspan><tspan fill="#9ca3af">= {</tspan></text>
    <text x="310" y="208" clip-path="url(#c2)"><tspan fill="#f3f4f6">  stack</tspan><tspan fill="#9ca3af">: [</tspan><tspan fill="#F87171">"React"</tspan><tspan fill="#9ca3af">, </tspan><tspan fill="#F87171">"Node"</tspan><tspan fill="#9ca3af">, </tspan><tspan fill="#F87171">"MongoDB"</tspan><tspan fill="#9ca3af">, </tspan><tspan fill="#F87171">"Java"</tspan><tspan fill="#9ca3af">],</tspan></text>
    <text x="310" y="224" clip-path="url(#c3)"><tspan fill="#f3f4f6">  openToWork</tspan><tspan fill="#9ca3af">: </tspan><tspan fill="#EF4444">true</tspan><tspan fill="#9ca3af">  };</tspan></text>
    <text x="310" y="240" clip-path="url(#c4)"><tspan fill="#EF4444">$ </tspan><tspan fill="#f3f4f6">npm run build-future</tspan></text>
    <rect x="478" y="229" width="8" height="13" fill="#EF4444" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0;1;0;1;0;1;0;0" keyTimes="0;0.40;0.5;0.6;0.7;0.8;0.9;0.94;0.96;1"/>
    </rect>
  </g>

  <!-- tagline -->
  <text x="580" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    <tspan fill="#ef4444">&lt;/&gt;</tspan> BUILDING CLEAN, SCALABLE WEB APPS
  </text>
</svg>
