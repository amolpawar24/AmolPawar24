definite"/><text x="478" y="170" class="d" font-size="64" fill="#247bff" opacity=".9">01</text><text x="478" y="214" class="d" font-size="28" fill="#f4f6fb">AI-POWERED APPS</text><text x="478" y="240" class="b" font-size="15" fill="#aab4c8"><tspan x="478">Integrating AI tools and models into</tspan><tspan x="478" dy="22">real full-stack projects.</tspan></text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/><text x="478" y="170" class="d" font-size="64" fill="#5b9cff" opacity=".9">02</text><text x="478" y="214" class="d" font-size="28" fill="#f4f6fb">SYSTEM DESIGN</text><text x="478" y="240" class="b" font-size="15" fill="#aab4c8"><tspan x="478">Deepening skills across React, Node.js</tspan><tspan x="478" dy="22">and architecture.</tspan></text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/><text x="478" y="170" class="d" font-size="64" fill="#247bff" opacity=".9">03</text><text x="478" y="214" class="d" font-size="28" fill="#f4f6fb">CODE. BREAK. FIX. REPEAT.</text><text x="478" y="244" class="b" font-size="15" fill="#aab4c8">The loop behind every project I ship.</text></g><rect x="478" y="288" width="112" height="5" rx="2.5" fill="#1b2744"/><rect x="478" y="288" width="112" height="5" rx="2.5" fill="#247bff"><animate attributeName="width" values="0;0;112;0;0" keyTimes="0;0.0000;0.3333;0.3343;1" dur="12s" repeatCount="indefinite"/></rect><rect x="598" y="288" width="112" height="5" rx="2.5" fill="#1b2744"/><rect x="598" y="288" width="112" height="5" rx="2.5" fill="#247bff"><animate attributeName="width" values="0;0;112;0;0" keyTimes="0;0.3333;0.6667;0.6677;1" dur="12s" repeatCount="indefinite"/></rect><rect x="718" y="288" width="112" height="5" rx="2.5" fill="#1b2744"/><rect x="718" y="288" width="112" height="5" rx="2.5" fill="#247bff"><animate attributeName="width"