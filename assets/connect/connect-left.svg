<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 420" width="440" height="420" role="img" aria-label="Let's build something great" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.d{font-family:Oswald,'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:700}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}.b{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
@keyframes cup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cup{animation:cup .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.35}}.cpulse{animation:cpulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="cdots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b2744"/></pattern>
<linearGradient id="cbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset=".5" stop-color="#1c2a52"/><stop offset="1" stop-color="#5b9cff"/></linearGradient>
<linearGradient id="cbg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#5b9cff"/></linearGradient></defs>
<a href="https://amolpawar.netlify.app/" xlink:href="https://amolpawar.netlify.app/" target="_blank" style="cursor:pointer"><rect width="440" height="420" rx="24" fill="#070b16"/><rect width="440" height="420" rx="24" fill="url(#cdots)"/>

