<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 410" width="900" height="410" role="img">
<style>.d{font-family:Oswald,'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:700}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}.b{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
@keyframes aup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.aup{animation:aup .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.35}}.apulse{animation:apulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><pattern id="adots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b2744"/></pattern>
<linearGradient id="abd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset=".5" stop-color="#1c2a52"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<linearGradient id="abg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient></defs>
<rect width="900" height="410" rx="24" fill="#070b16"/><rect width="900" height="410" rx="24" fill="url(#adots)"/>
<circle cx="840" cy="30" r="170" fill="#247bff" opacity=".07"/><circle cx="40" cy="410" r="170" fill="#ff354f" opacity=".06"/>
<rect x="1" y="1" width="898" height="408" rx="23" fill="none" stroke="url(#abd)" stroke-width="2"/>
<text x="48" y="62" class="m" font-size="13" fill="#ff354f" letter-spacing="2">CAPABILITIES</text><text x="48" y="104" class="d" font-size="40" fill="#f4f6fb">WHAT I BUILD.</text><g class="aup" style="animation-delay:0.2s"><rect x="48" y="140" width="360" height="42" rx="12" fill="#0f1830" stroke="#223056"/><rect x="48" y="150" width="4" height="22" rx="2" fill="#247bff"/><text x="66" y="158" class="m" font-size="11" fill="#aab4c8" letter-spacing="1.5">FRONTEND</text><text x="66" y="174" class="b" font-size="13.5" fill="#f4f6fb">React · Next.js · Redux · Tailwind</text></g><g class="aup" style="animation-delay:0.35s"><rect x="48" y="192" width="360" height="42" rx="12" fill="#0f1830" stroke="#223056"/><rect x="48" y="202" width="4" height="22" rx="2" fill="#ff354f"/><text x="66" y="210" class="m" font-size="11" fill="#aab4c8" letter-spacing="1.5">BACKEND</text><text x="66" y="226" class="b" font-size="13.5" fill="#f4f6fb">Node.js · Express · Java · Spring</text></g><g class="aup" style="animation-delay:0.5s"><rect x="48" y="244" width="360" height="42" rx="12" fill="#0f1830" stroke="#223056"/><rect x="48" y="254" width="4" height="22" rx="2" fill="#247bff"/><text x="66" y="262" class="m" font-size="11" fill="#aab4c8" letter-spacing="1.5">DATABASES</text><text x="66" y="278" class="b" font-size="13.5" fill="#f4f6fb">MongoDB · MySQL · PostgreSQL</text></g><g class="aup" style="animation-delay:0.6499999999999999s"><rect x="48" y="296" width="360" height="42" rx="12" fill="#0f1830" stroke="#223056"/><rect x="48" y="306" width="4" height="22" rx="2" fill="#ff354f"/><text x="66" y="314" class="m" font-size="11" fill="#aab4c8" letter-spacing="1.5">AI INTEGRATION</text><text x="66" y="330" class="b" font-size="13.5" fill="#f4f6fb">Adding AI tools &amp; models to full-stack apps</text></g><text x="48" y="372" class="m" font-size="11" fill="#ff354f" letter-spacing="1.5">LET'S DISCUSS</text><g class="aup" style="animation-delay:.9s"><rect x="190" y="352" width="100" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="203" y="371" class="b" font-size="12.5" fill="#f4f6fb">JavaScript</text></g><g class="aup" style="animation-delay:.9s"><rect x="298.0" y="352" width="85" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="311.0" y="371" class="b" font-size="12.5" fill="#f4f6fb">React.js</text></g><g class="aup" style="animation-delay:.9s"><rect x="391.2" y="352" width="78" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="404.2" y="371" class="b" font-size="12.5" fill="#f4f6fb">Node.js</text></g><g class="aup" style="animation-delay:.9s"><rect x="477.0" y="352" width="78" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="490.0" y="371" class="b" font-size="12.5" fill="#f4f6fb">MongoDB</text></g><g class="aup" style="animation-delay:.9s"><rect x="562.8" y="352" width="56" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="575.8" y="371" class="b" font-size="12.5" fill="#f4f6fb">Java</text></g><g class="aup" style="animation-delay:.9s"><rect x="626.4" y="352" width="130" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="639.4" y="371" class="b" font-size="12.5" fill="#f4f6fb">AI Integration</text></g><g class="aup" style="animation-delay:.9s"><rect x="764.0" y="352" width="115" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="777.0" y="371" class="b" font-size="12.5" fill="#f4f6fb">Architecture</text></g><g class="aup" style="animation-delay:.9s"><rect x="886.8" y="352" width="122" height="28" rx="14" fill="#0f1830" stroke="#223056"/><text x="899.8" y="371" class="b" font-size="12.5" fill="#f4f6fb">Git Workflows</text></g><rect x="450" y="40" width="402" height="280" rx="20" fill="#0c1428" stroke="url(#abd)" stroke-width="1.5"/><text x="478" y="76" class="m" font-size="13" fill="#ff354f" letter-spacing="2">CURRENTLY EXPLORING</text><g opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/><text x="478" y="170" class="d" font-size="64" fill="#247bff" opacity=".9">01</text><text x="478" y="214" class="d" font-size="28" fill="#f4f6fb">AI-POWERED APPS</text><text x="478" y="244" class="b" font-size="15" fill="#aab4c8">Integrating AI tools and models into real full-stack projects.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/><text x="478" y="170" class="d" font-size="64" fill="#ff354f" opacity=".9">02</text><text x="478" y="214" class="d" font-size="28" fill="#f4f6fb">SYSTEM DESIGN</text><text x="478" y="244" class="b" font-size="15" fill="#aab4c8">Deepening skills across React, Node.js and architecture.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;.3333;.6667" dur="12s" repeatCount="indefinite"/><text x="478" y="170" class="d" font-size="64" fill="#247bff" opacity=".9">03</text><text x="478" y="214" class="d" font-size="28" fill="#f4f6fb">CODE. BREAK. FIX. REPEAT.</text><text x="478" y="244" class="b" font-size="15" fill="#aab4c8">The loop behind every project I ship.</text></g><rect x="478" y="288" width="112" height="5" rx="2.5" fill="#1b2744"/><rect x="478" y="288" width="112" height="5" rx="2.5" fill="#247bff"><animate attributeName="width" values="0;0;112;0;0" keyTimes="0;0.0000;0.3333;0.3343;1" dur="12s" repeatCount="indefinite"/></rect><rect x="598" y="288" width="112" height="5" rx="2.5" fill="#1b2744"/><rect x="598" y="288" width="112" height="5" rx="2.5" fill="#247bff"><animate attributeName="width" values="0;0;112;0;0" keyTimes="0;0.3333;0.6667;0.6677;1" dur="12s" repeatCount="indefinite"/></rect><rect x="718" y="288" width="112" height="5" rx="2.5" fill="#1b2744"/><rect x="718" y="288" width="112" height="5" rx="2.5" fill="#247bff"><animate attributeName="width" values="0;0;112" keyTimes="0;0.6667;1" dur="12s" repeatCount="indefinite"/></rect></svg>