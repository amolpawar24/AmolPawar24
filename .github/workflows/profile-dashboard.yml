name: Update GitHub Profile Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Dashboard
        env:
          GH_USERNAME: amolpawar24
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-dashboard.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update profile dashboard"
          git push
